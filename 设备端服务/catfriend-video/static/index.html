<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111518">
  <title>CatFriend · 设备监控</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./player.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <header class="page-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true">CF</span><div><strong>CatFriend</strong><span class="eyebrow">设备端 · 实时监控</span></div></div>
      <span class="connection-pill" id="connection-pill" data-tone="waiting"><span class="dot" aria-hidden="true"></span><span id="connection-label">正在连接</span></span>
    </header>

    <section class="monitor" aria-labelledby="monitor-title">
      <div class="section-heading">
        <div><p class="eyebrow">LIVE VIEW</p><h1 id="monitor-title">看看猫咪在做什么</h1></div>
        <span class="source-tag" id="test-label" hidden>测试画面</span>
      </div>
      <div class="viewport" id="viewport" aria-busy="true">
        <img id="stream" alt="设备摄像头实时画面">
        <div class="view-overlay" id="view-overlay">
          <span class="loader" id="loader" aria-hidden="true"></span>
          <strong id="view-title">正在连接设备</strong>
          <p id="view-detail">正在获取视频源状态，请稍候。</p>
        </div>
        <div class="view-caption"><span class="dot" aria-hidden="true"></span><span id="stream-label">尚未请求画面</span></div>
      </div>
      <div class="monitor-footer">
        <div class="status-copy" role="status" aria-live="polite" aria-atomic="true"><strong id="status-title">正在加载</strong><p id="status-detail">连接同一设备上的视频服务。</p></div>
        <div class="actions"><a class="button button-secondary" href="/snapshot.jpg" target="_blank" rel="noopener noreferrer">打开截图 <span aria-hidden="true">↗</span></a><button class="button button-primary" id="retry-button" type="button">重新连接</button></div>
      </div>
    </section>

    <section class="metrics-panel" aria-labelledby="metrics-title">
      <div class="metrics-heading"><h2 id="metrics-title">视频源状态</h2><span id="updated-at">等待状态更新</span></div>
      <dl class="metrics">
        <div><dt>视频源</dt><dd id="metric-source">—</dd></div>
        <div><dt>源状态</dt><dd id="metric-state">—</dd></div>
        <div><dt>分辨率</dt><dd id="metric-resolution">—</dd></div>
        <div><dt>实测 / 配置帧率</dt><dd id="metric-fps">—</dd></div>
        <div><dt>最新帧距今</dt><dd id="metric-age">—</dd></div>
        <div><dt>观看连接</dt><dd id="metric-viewers">—</dd></div>
      </dl>
      <div class="error-notice" id="error-notice" hidden><span>设备提示</span><p id="last-error"></p></div>
    </section>
    <footer class="page-footer"><span>CatFriend · 陪伴不打扰</span><span>设备直连</span></footer>
  </main>
</body>
</html>
